openapi: 3.0.3
info:
  title: Root2Rise Backend API
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /frameworks:
    get:
      summary: Get sector skill frameworks
      responses:
        '200':
          description: OK
  /profiles/me:
    get:
      summary: Get current user's profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
    put:
      summary: Upsert current user's profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sector: { type: string, enum: [healthcare, agriculture, urban] }
                skills: { type: object, additionalProperties: { type: number } }
      responses:
        '200':
          description: OK
  /analysis/gap:
    post:
      summary: Compute skill gaps
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sector: { type: string, enum: [healthcare, agriculture, urban] }
                skills: { type: object, additionalProperties: { type: number } }
      responses:
        '200':
          description: OK
  /recommendations:
    post:
      summary: Get learning resources based on gaps
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sector: { type: string, enum: [healthcare, agriculture, urban] }
                skills: { type: object, additionalProperties: { type: number } }
      responses:
        '200':
          description: OK
  /roadmap:
    post:
      summary: Build roadmap and pathway tips
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sector: { type: string, enum: [healthcare, agriculture, urban] }
                skills: { type: object, additionalProperties: { type: number } }
      responses:
        '200':
          description: OK
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
